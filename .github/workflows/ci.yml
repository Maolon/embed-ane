name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Xcode 26+ is required to compile the Icon Composer app icon.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          sw_vers
      - name: Build
        run: swift build
      - name: Test
        # A one-thread cooperative pool exposes tests that block it (CI VMs
        # have few cores, so such tests hang there but pass on a laptop).
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        timeout-minutes: 15
        run: swift test
      - name: App (unsigned compile; no model execution)
        run: bash scripts/build-app.sh
