name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 1.0.0"
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "bad version: $V" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Test
        # A one-thread cooperative pool exposes tests that block it (CI VMs
        # have few cores, so such tests hang there but pass on a laptop).
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        timeout-minutes: 15
        run: swift test
      - name: Package
        run: bash scripts/package-dmg.sh "${{ steps.version.outputs.version }}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: embed-ane-${{ steps.version.outputs.version }}
          path: dist/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Embed ANE ${{ steps.version.outputs.version }}" \
            --notes "Ad-hoc signed build for Apple silicon (macOS 15+). See the README for first-launch steps and model download."
